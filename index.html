<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - To Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="todo-container">

            <!-- HEADER -->

            <header class="header">

                <div>
                    <p class="label">TASK MANAGEMENT</p>

                    <h1>My To-Do List</h1>

                    <p class="subtitle">
                        Organize your day, one task at a time.
                    </p>
                </div>

                <div class="task-count">
                    <span id="taskCount">0</span>
                    <small>Tasks</small>
                </div>

            </header>


            <!-- ADD TASK -->

            <form id="taskForm" class="task-form">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs to be done?"
                    autocomplete="off"
                >

                <button type="submit">
                    Add Task
                </button>

            </form>


            <!-- FILTERS -->

            <div class="filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>


            <!-- TASK LIST -->

            <ul id="taskList" class="task-list"></ul>


            <!-- EMPTY MESSAGE -->

            <div id="emptyMessage" class="empty-message">

                <div class="check-icon">
                    ✓
                </div>

                <h2>No tasks yet</h2>

                <p>Add a task above to get started.</p>

            </div>


            <!-- FOOTER -->

            <footer class="footer">

                <p>
                    <span id="remainingCount">0</span>
                    task(s) remaining
                </p>

                <button
                    type="button"
                    id="clearCompleted">
                    Clear Completed
                </button>

            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
